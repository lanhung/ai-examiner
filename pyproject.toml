[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-examiner-mvp"
version = "0.9.0.dev0"
description = "A deployable multimodal, evidence-grounded AI examiner with low-latency realtime voice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "pypdf>=6.0,<7.0",
  "pymupdf>=1.26,<2.0",
  "pillow>=11.0,<13.0",
  "python-pptx>=1.0,<2.0",
  "python-docx>=1.1,<2.0",
  "pyyaml>=6.0,<7.0",
  "celery[redis]>=5.5,<6.0",
  "redis>=6.0,<7.0",
  "httpx>=0.28,<1.0",
  "json-repair>=0.61,<1.0",
  "jsonschema>=4.25,<5.0",
  "websockets>=15.0,<17.0",
  "alembic>=1.16,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "boto3>=1.40,<2.0",
  "opentelemetry-api>=1.36,<2.0",
  "opentelemetry-sdk>=1.36,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.57b0,<1.0",
  "opentelemetry-instrumentation-celery>=0.57b0,<1.0",
]

[project.optional-dependencies]
providers = [
  "openai>=1.100,<3.0",
  "anthropic>=0.70,<1.0",
  "google-genai>=2.3,<3.0",
]
dev = [
  "pytest>=8.4,<10.0",
  "pytest-cov>=6.2,<8.0",
  "httpx>=0.28,<1.0",
  "pip-audit>=2.9,<3.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
ai-examiner = "ai_examiner.main:run"
ai-examiner-build-corpus = "ai_examiner.cli:build_corpus"
ai-examiner-backup = "ai_examiner.ops:backup_cli"
ai-examiner-evaluate-templates = "ai_examiner.template_eval_cli:run_template_evaluation"
ai-examiner-probe-template-providers = "ai_examiner.template_provider_probe_cli:run_template_provider_probe"
ai-examiner-evaluate-template-relevance = "ai_examiner.template_relevance_cli:run_template_relevance_evaluation"
ai-examiner-probe-template-relevance = "ai_examiner.template_relevance_probe_cli:run_template_relevance_probe"
ai-examiner-bootstrap-admin = "ai_examiner.enterprise_cli:bootstrap_admin"
ai-examiner-migrate-storage = "ai_examiner.storage_cli:run_storage_migration"
ai-examiner-verify-v09-release = "ai_examiner.release_hardening:main"
ai-examiner-probe-model-governance = "ai_examiner.model_governance_probe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_examiner"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
