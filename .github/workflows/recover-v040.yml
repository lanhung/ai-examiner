name: Recover and publish AI Examiner v0.4.0

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  recover-publish:
    if: startsWith(github.head_ref, 'agent/trigger-v040-import')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover damaged transport chunks by SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          targets = {
              'part-02': (18000, '1e0ccbe72c6dab48b9a26716dc725179c3cb056f73db09f24ee65c2213b52153'),
              'part-05': (12840, '7d95667d1a0cab7278e31e1b4727b3136eb62ae51e07ea99ff28d1a8e9021ade'),
          }
          roots = [Path('.release'), Path('.release-v040'), Path('.bootstrap'), Path('.bootstrap-v040')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob('*') if p.is_file())

          report = []
          recovered = {}
          for name, (length, wanted) in targets.items():
              for path in files:
                  data = path.read_bytes()
                  if len(data) < length:
                      continue
                  candidates = []
                  if len(data) == length:
                      candidates.append((0, data))
                  else:
                      candidates.append((0, data[:length]))
                      candidates.append((len(data) - length, data[-length:]))
                  seen = set()
                  for offset, candidate in candidates:
                      if offset in seen:
                          continue
                      seen.add(offset)
                      if hashlib.sha256(candidate).hexdigest() == wanted:
                          recovered[name] = candidate
                          report.append(f'{name}: {path} offset={offset} fast-path')
                          break
                  if name in recovered:
                      break

              if name in recovered:
                  continue

              for path in files:
                  data = path.read_bytes()
                  limit = len(data) - length
                  if limit < 0:
                      continue
                  for offset in range(limit + 1):
                      candidate = data[offset:offset + length]
                      if hashlib.sha256(candidate).hexdigest() == wanted:
                          recovered[name] = candidate
                          report.append(f'{name}: {path} offset={offset} window-search')
                          break
                  if name in recovered:
                      break

          Path('/tmp/recovery-report.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print(Path('/tmp/recovery-report.txt').read_text())
          missing = sorted(set(targets) - set(recovered))
          if missing:
              Path('/tmp/recovery-missing.txt').write_text(','.join(missing), encoding='utf-8')
              raise SystemExit(f'Missing recoverable chunks: {missing}')
          for name, data in recovered.items():
              Path(f'/tmp/{name}').write_bytes(data)
          PY

      - name: Assemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .release-v040/part-00 \
            .release-v040/part-01 \
            /tmp/part-02 \
            .release-v040/part-03 \
            .release-v040/part-04 \
            /tmp/part-05 \
            > /tmp/v040.tar.xz.b64
          echo '7a11faad502f2ec07740c4a68a16b07ba28383aae6e60778048fad8729e5d8ee  /tmp/v040.tar.xz.b64' | sha256sum -c -
          base64 --decode /tmp/v040.tar.xz.b64 > /tmp/v040.tar.xz
          echo '466cf0508f6c175d7df59a75991208b0805217a8e3447372d58fac7b6288699c  /tmp/v040.tar.xz' | sha256sum -c -
          mkdir -p /tmp/v040
          tar -xJf /tmp/v040.tar.xz -C /tmp/v040

      - name: Replace repository with clean source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/v040/ ./

      - name: Refuse obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude='.env.example' --exclude-dir='.git' '(sk-proj-|sk-ant-api|AIza[0-9A-Za-z_-]{20,})' .; then
            echo 'Potential API secret detected; refusing to commit.' >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest
      - run: node --check src/ai_examiner/static/app.js

      - name: Commit clean source and create tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: AI Examiner v0.4.0 realtime voice beta'
          git tag -f -a v0.4.0 -m 'AI Examiner v0.4.0 realtime voice beta'
          git push origin main
          git push --force origin v0.4.0
