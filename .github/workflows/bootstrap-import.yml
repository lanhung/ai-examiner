name: Bootstrap source import

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/ai-examiner-v0.3.0.tar.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: ${{ hashFiles('.bootstrap/ai-examiner-v0.3.0.tar.gz.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and extract clean source tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-examiner-import
          base64 --decode .bootstrap/ai-examiner-v0.3.0.tar.gz.b64 > /tmp/ai-examiner-v0.3.0.tar.gz
          tar -xzf /tmp/ai-examiner-v0.3.0.tar.gz -C /tmp/ai-examiner-import
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.github/workflows/bootstrap-import.yml' \
            /tmp/ai-examiner-import/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml
      - name: Verify no obvious secrets were imported
        run: |
          set -euo pipefail
          if grep -RInE --exclude='.env.example' --exclude-dir='.git' '(sk-proj-|sk-ant-api|AIza[0-9A-Za-z_-]{20,})' .; then
            echo 'Potential secret detected; refusing to commit.' >&2
            exit 1
          fi
      - name: Commit imported source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: import AI Examiner v0.3.0 source and documentation'
          git push origin main
