name: Rewrite v0.4.0 as clean repository root

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  rewrite-clean-history:
    if: startsWith(github.head_ref, 'agent/cleanup-v040-history')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate current v0.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version = "0.4.0"' pyproject.toml
          test -f src/ai_examiner/services/voice.py
          test -f deploy/update-from-github.sh
          if grep -RInE --exclude='.env.example' --exclude-dir='.git' '(sk-proj-|sk-ant-api|AIza[0-9A-Za-z_-]{20,})' .; then
            echo 'Potential API secret detected; refusing history rewrite.' >&2
            exit 1
          fi

      - name: Run release checks
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest
      - run: node --check src/ai_examiner/static/app.js

      - name: Rebuild main as one clean root commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/clean-source
          rsync -a --exclude='.git/' --exclude='.github/workflows/cleanup-v040-history.yml' ./ /tmp/clean-source/

          git checkout --orphan clean-v040-root
          git rm -rf .
          rsync -a /tmp/clean-source/ ./

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: AI Examiner v0.4.0 realtime voice beta'
          git branch -M main
          git tag -f -a v0.4.0 -m 'AI Examiner v0.4.0 realtime voice beta'
          git push --force origin main
          git push --force origin v0.4.0
