name: Import AI Examiner v0.4.0

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap-v040/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source archive
        run: |
          set -euo pipefail
          cat .bootstrap-v040/part-* > /tmp/ai-examiner-v0.4.0.tar.gz.b64
          base64 --decode /tmp/ai-examiner-v0.4.0.tar.gz.b64 > /tmp/ai-examiner-v0.4.0.tar.gz
          echo '582f104c9d2a1a9f0dffccd0b69856577e9ec84c20952671912fa19e26594a6d  /tmp/ai-examiner-v0.4.0.tar.gz' | sha256sum -c -

      - name: Replace repository with the clean v0.4.0 tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-examiner-import
          tar -xzf /tmp/ai-examiner-v0.4.0.tar.gz -C /tmp/ai-examiner-import
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap-v040/' \
            --exclude='.github/workflows/import-v040.yml' \
            /tmp/ai-examiner-import/ ./
          rm -rf .bootstrap .bootstrap-v040
          rm -f .github/workflows/bootstrap-import.yml .github/workflows/import-v040.yml
          rm -f UPLOAD_IN_PROGRESS.md

      - name: Refuse obvious secrets
        run: |
          set -euo pipefail
          if grep -RInE --exclude='.env.example' --exclude-dir='.git' '(sk-proj-|sk-ant-api|AIza[0-9A-Za-z_-]{20,})' .; then
            echo 'Potential API secret detected; refusing to commit.' >&2
            exit 1
          fi

      - name: Commit v0.4.0
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: AI Examiner v0.4.0 realtime voice beta'
          git push origin main
