name: Diagnose AI Examiner v0.4.0 chunks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: startsWith(github.head_ref, 'agent/trigger-v040-import')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record chunk diagnostics
        shell: bash
        run: |
          set -u
          {
            for part in .release-v040/part-*; do
              printf '%s bytes=' "$part"
              wc -c < "$part" | tr -d ' '\n              printf ' sha256='
              sha256sum "$part" | cut -d' ' -f1
            done
            cat .release-v040/part-* > /tmp/v040.tar.xz.b64
            echo "combined_encoded_bytes=$(wc -c < /tmp/v040.tar.xz.b64)"
            echo "combined_encoded_sha256=$(sha256sum /tmp/v040.tar.xz.b64 | cut -d' ' -f1)"
            if base64 --decode /tmp/v040.tar.xz.b64 > /tmp/v040.tar.xz 2>/tmp/decode.err; then
              echo 'base64_status=ok'
            else
              echo 'base64_status=failed'
            fi
            echo "base64_error=$(tr '\n' ' ' < /tmp/decode.err)"
            echo "decoded_bytes=$(wc -c < /tmp/v040.tar.xz)"
            echo "decoded_sha256=$(sha256sum /tmp/v040.tar.xz | cut -d' ' -f1)"
          } > CHUNK_DIAGNOSTICS.txt
          cat CHUNK_DIAGNOSTICS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHUNK_DIAGNOSTICS.txt
          git commit -m 'chore: record v0.4.0 chunk diagnostics'
          git push origin main
