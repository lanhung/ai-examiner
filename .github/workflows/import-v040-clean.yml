name: Import clean AI Examiner v0.4.0

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap-v040-clean/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source archive
        run: |
          set -euo pipefail
          cat \
            .bootstrap-v040-clean/part-00 \
            .bootstrap-v040-clean/part-01 \
            .bootstrap-v040-clean/part-02 \
            .bootstrap-v040-clean/part-03 \
            .bootstrap-v040-clean/tail-00 \
            .bootstrap-v040-clean/tail-01 \
            .bootstrap-v040-clean/tail-02 \
            .bootstrap-v040-clean/tail-03 \
            .bootstrap-v040-clean/tail-04 \
            .bootstrap-v040-clean/tail-05 \
            .bootstrap-v040-clean/tail-06 \
            .bootstrap-v040-clean/tail-07 \
            > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.tar.xz
          echo '74f199276bf783a9d380c16e56f21d3efda223b0384a4c39e965cc7155a03002  /tmp/source.tar.xz' | sha256sum -c -

      - name: Replace repository with clean v0.4.0 source
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-examiner-import
          tar -xJf /tmp/source.tar.xz -C /tmp/ai-examiner-import
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap-v040-clean/' \
            --exclude='.github/workflows/import-v040-clean.yml' \
            /tmp/ai-examiner-import/ ./
          rm -rf .bootstrap-v040-clean

      - name: Refuse obvious API secrets
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude='.env.example' \
            --exclude-dir='.git' \
            '(sk-proj-|sk-ant-api|AIza[0-9A-Za-z_-]{20,})' .; then
            echo 'Potential API secret detected; refusing to commit.' >&2
            exit 1
          fi

      - name: Commit clean v0.4.0 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: AI Examiner v0.4.0 realtime voice beta'
          git push origin main
