services:
  ai-examiner:
    environment:
      APP_ENV: production
      DATABASE_URL: ${ENTERPRISE_DATABASE_URL:?Set ENTERPRISE_DATABASE_URL}
      DATABASE_SCHEMA_MANAGEMENT: external
      POSTGRES_RLS_MODE: enforce
      AUTH_MODE: oidc
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    environment:
      APP_ENV: production
      DATABASE_URL: ${ENTERPRISE_DATABASE_URL:?Set ENTERPRISE_DATABASE_URL}
      DATABASE_SCHEMA_MANAGEMENT: external
      POSTGRES_RLS_MODE: enforce
      AUTH_MODE: oidc
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?Set POSTGRES_MIGRATION_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_examiner}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 2G
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  database-bootstrap:
    build: .
    command: ["python", "/app/deploy/enterprise/bootstrap_database.py", "migrate"]
    environment:
      DATABASE_URL: ${ENTERPRISE_MIGRATION_DATABASE_URL:?Set ENTERPRISE_MIGRATION_DATABASE_URL}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
