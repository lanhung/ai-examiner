services:
  ai-examiner:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build: .
    command: ["celery", "-A", "ai_examiner.jobs.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
