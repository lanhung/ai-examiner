schema_version: "1.0"
template:
  slug: enterprise.sales_objection
  version: 1.0.0
  category: enterprise
  title: {zh-CN: 销售异议训练, en: Sales Objection Practice}
  description: {zh-CN: 通过角色扮演训练需求发现、价值表达、异议处理与合规边界。, en: "Roleplay for discovery, value communication, objection handling, and ethical boundaries."}
  trust_level: built_in_reviewed
  intended_use: internal_training
  risk_tier: moderate
capabilities:
  required: [assessment]
  optional: [documents, evidence, voice, adaptive_questions, long_term_memory]
objectives:
  - {id: discovery, title: {zh-CN: 需求发现, en: Discovery}, weight: 0.25, required_evidence: answer}
  - {id: needs_reasoning, title: {zh-CN: 需求推理, en: Needs reasoning}, weight: 0.20, required_evidence: answer}
  - {id: value_communication, title: {zh-CN: 价值表达, en: Value communication}, weight: 0.20, required_evidence: answer}
  - {id: objection_handling, title: {zh-CN: 异议处理, en: Objection handling}, weight: 0.20, required_evidence: answer}
  - {id: ethical_boundaries, title: {zh-CN: 合规边界, en: Ethical boundaries}, weight: 0.15, required_evidence: answer}
question_policy:
  allowed_types: [discovery, objection, apply, compare, risk, metacognitive]
  coverage:
    discovery: {minimum_questions: 1}
    value_communication: {minimum_questions: 1}
    objection_handling: {minimum_questions: 1}
    ethical_boundaries: {minimum_questions: 1}
  difficulty: {initial: 3, minimum: 1, maximum: 5, adaptive: true}
  selection_strategy: adaptive
  question_limit: 6
assistance_policy:
  mode: bounded
  hints: {allowed: true, maximum_per_question: 1}
  corrections: {allowed: true, timing: session_end}
  answer_disclosure: {allowed: false}
conversation_policy:
  max_followups_per_question: 2
  allowed_actions: [ASK_FOLLOWUP, ASK_FOR_REASON, ASK_FOR_EXAMPLE, CLARIFY, CHALLENGE, GIVE_HINT, MOVE_ON, END]
  interruption: {enabled: false, level: "off", user_can_disable: true}
assessment_policy:
  scale: {minimum: 0, maximum: 5}
  dimensions:
    - {id: correctness, title: {zh-CN: 信息准确性, en: Information accuracy}, weight: 0.20, evidence_required: true}
    - {id: completeness, title: {zh-CN: 对话完整性, en: Dialogue completeness}, weight: 0.20, evidence_required: true}
    - {id: evidence_reasoning, title: {zh-CN: 需求与价值推理, en: Needs and value reasoning}, weight: 0.25, evidence_required: true}
    - {id: boundary_awareness, title: {zh-CN: 合规与边界, en: Compliance and boundaries}, weight: 0.35, evidence_required: true}
  assisted_performance: report_separately
  aggregate: no_total
report_policy:
  sections: [summary, objective_scores, dimension_scores, evidence, strengths, weaknesses, learning_gain, improvement_path, recommended_actions]
  show_total_score: false
  required_disclaimer: advisory_human_review_required
safety_policy:
  prohibited_uses: [automatic_employment_decision, protected_trait_inference, personality_or_emotion_scoring]
  human_review_required: true
  protected_trait_inference: forbidden
presentation_policy: {role_id: sales_customer, style_id: roleplay}
voice_policy: {provider: disabled}
compatibility: {mode: teaching, difficulty: adaptive}
overrides:
  question_limit: {kind: bounded, minimum: 3, maximum: 12, default: 6}
  max_followups_per_question: {kind: bounded, minimum: 0, maximum: 4, default: 2}
  difficulty_initial: {kind: bounded, minimum: 1, maximum: 5, default: 3}
  question_strategy: {kind: selectable, values: [fixed, adaptive], default: adaptive}
  hints_allowed: {kind: toggle, default: true, direction: disable_only}
  corrections_allowed: {kind: toggle, default: true, direction: disable_only}
  active_interruption: {kind: locked}
  voice_provider: {kind: selectable, values: [disabled, openai, qwen], default: disabled}
