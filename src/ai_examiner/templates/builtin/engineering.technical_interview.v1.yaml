schema_version: "1.0"
template:
  slug: engineering.technical_interview
  version: 1.0.0
  category: engineering
  title: {zh-CN: 技术面试训练, en: Technical Interview Practice}
  description: {zh-CN: 面向问题分析、架构权衡与工程风险的技术面试训练。, en: "Technical interview practice for problem analysis, architecture tradeoffs, and engineering risk."}
  trust_level: built_in_reviewed
  intended_use: practice
  risk_tier: high
capabilities:
  required: [assessment]
  optional: [documents, evidence, voice, adaptive_questions, long_term_memory]
objectives:
  - {id: problem_framing, title: {zh-CN: 问题界定, en: Problem framing}, weight: 0.25, required_evidence: answer}
  - {id: architecture, title: {zh-CN: 架构设计, en: Architecture}, weight: 0.25, required_evidence: answer}
  - {id: tradeoffs, title: {zh-CN: 权衡分析, en: Tradeoffs}, weight: 0.25, required_evidence: answer}
  - {id: validation, title: {zh-CN: 验证与证据, en: Validation}, weight: 0.15, required_evidence: answer}
  - {id: communication, title: {zh-CN: 技术表达, en: Technical communication}, weight: 0.10, required_evidence: answer}
question_policy:
  allowed_types: [apply, analyze, compare, tradeoff, risk, decision, counterexample, transfer]
  coverage:
    problem_framing: {minimum_questions: 1}
    architecture: {minimum_questions: 1}
    tradeoffs: {minimum_questions: 1}
    validation: {minimum_questions: 1}
  difficulty: {initial: 3, minimum: 2, maximum: 5, adaptive: true}
  selection_strategy: adaptive
  question_limit: 6
assistance_policy:
  mode: none
  hints: {allowed: false, maximum_per_question: 0}
  corrections: {allowed: false, timing: never}
  answer_disclosure: {allowed: false}
conversation_policy:
  max_followups_per_question: 2
  allowed_actions: [ASK_FOR_REASON, ASK_FOR_EVIDENCE, ASK_FOR_COUNTEREXAMPLE, CHALLENGE, CLARIFY, MOVE_ON, END]
  interruption: {enabled: false, level: "off", user_can_disable: true}
assessment_policy:
  scale: {minimum: 0, maximum: 5}
  dimensions:
    - {id: correctness, title: {zh-CN: 技术正确性, en: Technical correctness}, weight: 0.30, evidence_required: true}
    - {id: completeness, title: {zh-CN: 方案完整性, en: Solution completeness}, weight: 0.20, evidence_required: true}
    - {id: evidence_reasoning, title: {zh-CN: 推理与验证, en: Reasoning and validation}, weight: 0.25, evidence_required: true}
    - {id: boundary_awareness, title: {zh-CN: 权衡与风险, en: Tradeoffs and risk}, weight: 0.25, evidence_required: true}
  assisted_performance: ignore
  aggregate: weighted_dimensions
report_policy:
  sections: [summary, objective_scores, dimension_scores, evidence, strengths, weaknesses, improvement_path, recommended_actions]
  show_total_score: true
  required_disclaimer: training_not_employment_decision
safety_policy:
  prohibited_uses: [automatic_employment_decision, protected_trait_inference, personality_or_emotion_scoring]
  human_review_required: true
  protected_trait_inference: forbidden
presentation_policy: {role_id: technical_interviewer, style_id: concise_challenging}
voice_policy: {provider: disabled}
compatibility: {mode: interview, difficulty: adaptive}
overrides:
  question_limit: {kind: bounded, minimum: 3, maximum: 12, default: 6}
  max_followups_per_question: {kind: bounded, minimum: 0, maximum: 4, default: 2}
  difficulty_initial: {kind: bounded, minimum: 2, maximum: 5, default: 3}
  question_strategy: {kind: selectable, values: [fixed, adaptive], default: adaptive}
  hints_allowed: {kind: locked}
  corrections_allowed: {kind: locked}
  active_interruption: {kind: locked}
  voice_provider: {kind: selectable, values: [disabled, openai, qwen], default: disabled}
