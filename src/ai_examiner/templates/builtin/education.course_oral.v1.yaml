schema_version: "1.0"
template:
  slug: education.course_oral
  version: 1.0.0
  category: education
  title: {zh-CN: 课程口试训练, en: Course Oral Practice}
  description: {zh-CN: 通过解释、应用和反思诊断课程知识理解。, en: "Diagnose course understanding through explanation, application, and reflection."}
  trust_level: built_in_reviewed
  intended_use: practice
  risk_tier: moderate
capabilities:
  required: [documents, assessment]
  optional: [evidence, voice, adaptive_questions, long_term_memory]
objectives:
  - {id: conceptual_understanding, title: {zh-CN: 概念理解, en: Conceptual understanding}, weight: 0.30, required_evidence: answer}
  - {id: application, title: {zh-CN: 应用能力, en: Application}, weight: 0.25, required_evidence: answer}
  - {id: reasoning, title: {zh-CN: 推理过程, en: Reasoning}, weight: 0.25, required_evidence: answer}
  - {id: reflection, title: {zh-CN: 反思与迁移, en: Reflection and transfer}, weight: 0.20, required_evidence: answer}
question_policy:
  allowed_types: [recall, explain, apply, compare, transfer, metacognitive]
  coverage:
    conceptual_understanding: {minimum_questions: 1}
    application: {minimum_questions: 1}
    reasoning: {minimum_questions: 1}
    reflection: {minimum_questions: 1}
  difficulty: {initial: 2, minimum: 1, maximum: 4, adaptive: true}
  selection_strategy: adaptive
  question_limit: 6
assistance_policy:
  mode: teaching
  hints: {allowed: true, maximum_per_question: 2}
  corrections: {allowed: true, timing: after_followups}
  answer_disclosure: {allowed: true}
conversation_policy:
  max_followups_per_question: 2
  allowed_actions: [ASK_FOLLOWUP, ASK_FOR_REASON, ASK_FOR_EXAMPLE, CLARIFY, GIVE_HINT, CORRECT, MOVE_ON, END]
  interruption: {enabled: false, level: "off", user_can_disable: true}
assessment_policy:
  scale: {minimum: 0, maximum: 5}
  dimensions:
    - {id: correctness, title: {zh-CN: 正确性, en: Correctness}, weight: 0.35, evidence_required: true}
    - {id: completeness, title: {zh-CN: 完整性, en: Completeness}, weight: 0.30, evidence_required: true}
    - {id: evidence_reasoning, title: {zh-CN: 推理质量, en: Reasoning quality}, weight: 0.25, evidence_required: true}
    - {id: boundary_awareness, title: {zh-CN: 反思边界, en: Reflective boundaries}, weight: 0.10, evidence_required: true}
  assisted_performance: report_separately
  aggregate: weighted_dimensions
report_policy:
  sections: [summary, objective_scores, dimension_scores, evidence, strengths, weaknesses, learning_gain, knowledge_map, improvement_path, recommended_actions, retest_plan]
  show_total_score: true
  required_disclaimer: practice_not_formal_decision
safety_policy:
  prohibited_uses: [automatic_admission_decision, automatic_employment_decision, protected_trait_inference, personality_or_emotion_scoring]
  human_review_required: true
  protected_trait_inference: forbidden
presentation_policy: {role_id: oral_instructor, style_id: socratic}
voice_policy: {provider: disabled}
compatibility: {mode: teaching, difficulty: adaptive}
overrides:
  question_limit: {kind: bounded, minimum: 2, maximum: 12, default: 6}
  max_followups_per_question: {kind: bounded, minimum: 0, maximum: 4, default: 2}
  difficulty_initial: {kind: bounded, minimum: 1, maximum: 4, default: 2}
  question_strategy: {kind: selectable, values: [fixed, adaptive], default: adaptive}
  hints_allowed: {kind: toggle, default: true, direction: disable_only}
  corrections_allowed: {kind: toggle, default: true, direction: disable_only}
  active_interruption: {kind: locked}
  voice_provider: {kind: selectable, values: [disabled, openai, qwen], default: disabled}
