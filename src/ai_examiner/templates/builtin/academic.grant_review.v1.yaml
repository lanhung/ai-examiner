schema_version: "1.0"
template:
  slug: academic.grant_review
  version: 1.0.0
  category: academic
  title: {zh-CN: 基金申请评审训练, en: Grant Review Practice}
  description: {zh-CN: 围绕科学价值、创新、方法与可行性的证据化评审训练。, en: "Evidence-grounded practice for scientific value, novelty, methods, and feasibility."}
  trust_level: built_in_reviewed
  intended_use: practice_and_advisory
  risk_tier: moderate
capabilities:
  required: [documents, evidence, assessment]
  optional: [voice, adaptive_questions, long_term_memory, visual_analysis]
objectives:
  - {id: significance, title: {zh-CN: 科学价值, en: Significance}, weight: 0.20, required_evidence: document_and_answer}
  - {id: innovation, title: {zh-CN: 创新性, en: Innovation}, weight: 0.20, required_evidence: document_and_answer}
  - {id: methodology, title: {zh-CN: 方法严谨性, en: Methodological rigor}, weight: 0.20, required_evidence: document_and_answer}
  - {id: feasibility, title: {zh-CN: 可行性, en: Feasibility}, weight: 0.20, required_evidence: document_and_answer}
  - {id: impact_risk, title: {zh-CN: 影响与风险, en: Impact and risk}, weight: 0.20, required_evidence: document_and_answer}
question_policy:
  allowed_types: [motivation, novelty, method, assumption, evidence, evaluate, risk, counterexample]
  coverage:
    significance: {minimum_questions: 1}
    innovation: {minimum_questions: 1}
    methodology: {minimum_questions: 1}
    feasibility: {minimum_questions: 1}
    impact_risk: {minimum_questions: 1}
  difficulty: {initial: 4, minimum: 2, maximum: 5, adaptive: true}
  selection_strategy: adaptive
  question_limit: 7
assistance_policy:
  mode: bounded
  hints: {allowed: false, maximum_per_question: 0}
  corrections: {allowed: true, timing: after_followups}
  answer_disclosure: {allowed: false}
conversation_policy:
  max_followups_per_question: 3
  allowed_actions: [ASK_FOR_REASON, ASK_FOR_EVIDENCE, ASK_FOR_COUNTEREXAMPLE, CHALLENGE, CLARIFY, MOVE_ON, END]
  interruption: {enabled: false, level: "off", user_can_disable: true}
assessment_policy:
  scale: {minimum: 0, maximum: 5}
  dimensions:
    - {id: correctness, title: {zh-CN: 正确性, en: Correctness}, weight: 0.25, evidence_required: true}
    - {id: completeness, title: {zh-CN: 完整性, en: Completeness}, weight: 0.15, evidence_required: true}
    - {id: evidence_reasoning, title: {zh-CN: 证据与推理, en: Evidence and reasoning}, weight: 0.35, evidence_required: true}
    - {id: boundary_awareness, title: {zh-CN: 风险与边界, en: Risk and boundaries}, weight: 0.25, evidence_required: true}
  assisted_performance: ignore
  aggregate: weighted_dimensions
report_policy:
  sections: [summary, objective_scores, dimension_scores, evidence, weaknesses, improvement_path, recommended_actions]
  show_total_score: true
  required_disclaimer: advisory_human_review_required
safety_policy:
  prohibited_uses: [automatic_admission_decision, automatic_employment_decision, protected_trait_inference, personality_or_emotion_scoring]
  human_review_required: true
  protected_trait_inference: forbidden
presentation_policy: {role_id: grant_reviewer, style_id: neutral_formal}
voice_policy: {provider: disabled}
compatibility: {mode: defense, difficulty: adaptive}
overrides:
  question_limit: {kind: bounded, minimum: 3, maximum: 12, default: 7}
  max_followups_per_question: {kind: bounded, minimum: 0, maximum: 4, default: 3}
  difficulty_initial: {kind: bounded, minimum: 2, maximum: 5, default: 4}
  question_strategy: {kind: selectable, values: [fixed, adaptive], default: adaptive}
  hints_allowed: {kind: locked}
  corrections_allowed: {kind: toggle, default: true, direction: disable_only}
  active_interruption: {kind: locked}
  voice_provider: {kind: selectable, values: [disabled, openai, qwen], default: disabled}
